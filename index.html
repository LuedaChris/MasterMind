<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MasterMind – Micro-Learning</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Zone 1: Fortschrittsbalken ganz oben -->
    <div id="progress-bar">
      <div id="progress-fill"></div>
    </div>

    <!-- Zone 2: Hier wird der Lerninhalt dynamisch eingesetzt -->
    <main id="screen-content"></main>

    <!-- Zone 3: Navigation unten fixiert -->
    <footer id="nav-footer">
      <button id="btn-back" class="nav-btn" disabled>Zurück</button>
      <span id="screen-counter"></span>
      <button id="btn-next" class="nav-btn nav-btn-primary">Weiter</button>
    </footer>
  </div>

  <noscript>
    <p>Bitte aktiviere JavaScript, um diese Lern-App nutzen zu können.</p>
  </noscript>

  <!-- Das Gehirn der App – wird ganz am Ende geladen -->
  <script src="js/app.js"></script>
</body>
</html>
